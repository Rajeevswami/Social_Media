[pytest]
DJANGO_SETTINGS_MODULE = social_media.settings.test
python_files = tests.py test_*.py
testpaths = common accounts posts social notifications ai_companion
# importlib mode: every app has its own `tests` package, which collides under
# the default prepend import mode.
addopts = -ra --strict-markers --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
