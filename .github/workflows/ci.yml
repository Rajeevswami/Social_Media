name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    name: Django lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system checks
        run: python manage.py check --settings=social_media.settings.test
        env:
          DJANGO_SETTINGS_MODULE: social_media.settings.test

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run --settings=social_media.settings.test

      - name: Tests
        run: pytest -q --maxfail=1

  ai-service:
    name: AI service lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q --maxfail=1

  integration:
    name: Django <-> AI service smoke test
    runs-on: ubuntu-latest
    needs: [django, ai-service]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install both services
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ai_service/requirements.txt

      - name: Boot the AI service
        working-directory: ai_service
        run: |
          API_KEYS=ci-key PROVIDER=heuristic nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > ai.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/health && break
            sleep 1
          done

      - name: Exercise moderation over real HTTP
        env:
          DJANGO_SETTINGS_MODULE: social_media.settings.test
          AI_SERVICE_BASE_URL: http://127.0.0.1:8001
          AI_SERVICE_API_KEY: ci-key
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/moderate \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-key' \
            -d '{"text":"you idiot and a loser"}' | tee /tmp/moderate.json
          grep -q '"is_safe":false' /tmp/moderate.json
