# Local development stack.
#
#   docker compose up --build
#
# Django UI/API : http://localhost:8000
# FastAPI docs  : http://localhost:8001/docs
# Postgres      : localhost:5432   Redis: localhost:6379
#
# Set CELERY_TASK_ALWAYS_EAGER=False in .env so moderation really goes through
# the worker (the default .env runs tasks inline for convenience).

name: social-media

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_media
      POSTGRES_USER: social_media
      POSTGRES_PASSWORD: social_media
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_media -d social_media"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./ai_service
    environment:
      API_KEYS: ${AI_SERVICE_API_KEY:-dev-internal-key-change-me}
      PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:8000
      ENVIRONMENT: dev
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn social_media.wsgi --bind 0.0.0.0:8000 --workers 2 --threads 2"
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-0123456789abcdef0123456789abcdef}
      DJANGO_ALLOWED_HOSTS: "*"
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://social_media:social_media@db:5432/social_media
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      AI_SERVICE_BASE_URL: http://ai:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-internal-key-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:3000
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

  worker:
    build:
      context: .
    command: celery -A social_media worker -l info -Q default,ai --concurrency 2
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-0123456789abcdef0123456789abcdef}
      DATABASE_URL: postgres://social_media:social_media@db:5432/social_media
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      AI_SERVICE_BASE_URL: http://ai:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-internal-key-change-me}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

  beat:
    build:
      context: .
    command: celery -A social_media beat -l info
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-0123456789abcdef0123456789abcdef}
      DATABASE_URL: postgres://social_media:social_media@db:5432/social_media
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
